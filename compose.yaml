# 로컬 개발용 MySQL. ./gradlew bootRun 하면 Spring Boot가 자동으로 띄우고 연결합니다.
services:
  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=auction'
      - 'MYSQL_USER=auction'
      - 'MYSQL_PASSWORD=auction'
      - 'MYSQL_ROOT_PASSWORD=root'
      - 'TZ=Asia/Seoul'
    ports:
      - '13306:3306'   # DB 툴 접속용: localhost:13306
